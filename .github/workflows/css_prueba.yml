name: Lint (ESLint + Stylelint)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-save eslint @eslint/js stylelint stylelint-config-standard

      - run: npx eslint . --ext .js

      - run: npx stylelint "**/*.css" --allow-empty-input
